apiVersion: 1

providers:
  - name: default
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
      # Tier subdirectories (Triage/, Operate/, ...) become Grafana folders;
      # dashboards at the root stay in General until the phase-7 cutover.
      foldersFromFilesStructure: true

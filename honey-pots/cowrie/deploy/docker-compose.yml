services:
  cowrie:
    build:
      context: ./cowrie-ext
    container_name: cowrie
    restart: unless-stopped
    ports:
      - "22:2222"
      - "23:2323"
    volumes:
      - ./cowrie/etc:/cowrie/cowrie-git/etc
      - ./cowrie/honeyfs:/cowrie/cowrie-git/src/cowrie/data/honeyfs:ro
      - ./cowrie/txtcmds:/cowrie/cowrie-git/share/cowrie/txtcmds:ro
      - ./volumes/var:/cowrie/cowrie-git/var
      - ./volumes/logs:/cowrie-logs
      - ../inbox/cowrie:/samples
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.8'
    networks:
      - honeypot

  capture-writer:
    build:
      context: ./capture-writer
    container_name: cowrie-capture-writer
    restart: unless-stopped
    volumes:
      - ./volumes/logs:/cowrie-logs:ro
      - ../inbox/cowrie:/samples
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.05'
    networks:
      - honeypot

  vector:
    image: timberio/vector:0.42.0-alpine
    container_name: vector
    restart: unless-stopped
    user: root
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./volumes/logs:/logs/cowrie:ro
      - /var/log:/hostlogs:ro
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      - vector-data:/vector-data
    environment:
      - LOKI_HOST=${LOKI_HOST}
      - HOSTNAME=${HONEYPOT_HOSTNAME:-cowrie-honeypot}
    networks:
      - honeypot

volumes:
  vector-data:

networks:
  honeypot:
    driver: bridge

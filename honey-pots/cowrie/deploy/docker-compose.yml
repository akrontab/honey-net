services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    restart: unless-stopped
    ports:
      - "22:2222"
      - "23:2323"
    volumes:
      - ./cowrie/etc:/cowrie/cowrie-git/etc
      - ./cowrie/honeyfs:/cowrie/cowrie-git/src/cowrie/data/honeyfs:ro
      - ./cowrie/txtcmds:/cowrie/cowrie-git/share/cowrie/txtcmds:ro
      - ./volumes/var:/cowrie/cowrie-git/var
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.8'
    networks:
      - honeypot

  vector:
    image: timberio/vector:0.42.0-alpine
    container_name: vector
    restart: unless-stopped
    user: root
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./volumes/var/log/cowrie:/logs/cowrie:ro
      - /var/log:/hostlogs:ro
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      - vector-data:/vector-data
      - analyzer-logs:/logs/malware:ro
    environment:
      - LOKI_HOST=${LOKI_HOST}
      - HOSTNAME=${HONEYPOT_HOSTNAME:-cowrie-honeypot}
    networks:
      - honeypot

  analyzer:
    build:
      context: ./analyzer
    container_name: analyzer
    restart: unless-stopped
    volumes:
      - ./volumes/var/lib/cowrie/downloads:/downloads:ro
      - analyzer-logs:/logs
      - ./analyzer/rules:/etc/yara/rules:ro
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
    networks:
      - honeypot

volumes:
  vector-data:
  analyzer-logs:

networks:
  honeypot:
    driver: bridge

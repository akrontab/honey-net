[honeypot]
# Fake AWS internal hostname (ip-<private-ip> format)
hostname = ip-172-31-42-87

# AuthRandom: randomly accepts or rejects login attempts regardless of credentials.
# Common default creds in userdb.txt always succeed; everything else is random.
auth_class = UserDB

etc_path = etc
contents_path = src/cowrie/data/honeyfs
log_path = var/log/cowrie
state_path = var/lib/cowrie
download_path = var/lib/cowrie/downloads

# Cap individual file downloads at 10MB to avoid filling the disk
download_limit_size = 10485760

# Fake kernel/OS to match an Ubuntu 22.04 AWS instance
kernel_version = 5.15.0-1037-aws
kernel_build_string = #41-Ubuntu SMP Fri Jan 20 00:00:00 UTC 2023
hardware_platform = x86_64
operating_system = GNU/Linux

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

# Match a real Ubuntu 22.04 AWS instance's SSH banner
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6

# How long to keep an attacker's session alive (seconds)
interactive_timeout = 180

[telnet]
enabled = true
listen_endpoints = tcp:2323:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json

[output_stdout]
enabled = false

data_dir = "/vector-data"

# ── Sources ───────────────────────────────────────────────────────────

[sources.cowrie_json]
type = "file"
include = ["/logs/cowrie/cowrie.json"]
read_from = "beginning"

[sources.auth_log]
type = "file"
include = ["/hostlogs/auth.log"]
read_from = "beginning"

[sources.syslog_file]
type = "file"
include = ["/hostlogs/syslog"]
read_from = "beginning"

# ── Transforms ────────────────────────────────────────────────────────

# Normalised cross-honeypot event stream. Raw cowrie events continue to ship
# untouched via [sinks.loki_cowrie]; this transform produces a parallel stream
# under {job="events", honeypot="cowrie"}.
[transforms.cowrie_events]
type = "remap"
inputs = ["cowrie_json"]
source = '''
raw = parse_json!(string!(.message))

event_type_map = {
  "cowrie.session.connect":       "connect",
  "cowrie.login.success":         "login",
  "cowrie.login.failed":          "login",
  "cowrie.command.input":         "command",
  "cowrie.command.failed":        "command",
  "cowrie.session.file_download": "download",
  "cowrie.session.closed":        "session_end",
}

eventid = string!(raw.eventid)
event_type, _ = get(event_type_map, [eventid])
if event_type == null { abort }

# payload carries command input only; on downloads the URL lives in meta.url
payload = null
if event_type == "command" { payload = raw.input }

# Standard meta vocabulary — see honey-pots/CLAUDE.md.
# Deferred (normalized-schema-plan.md Q5): client_fingerprint / client_version /
# protocol-on-every-event arrive on separate eventids and need session
# correlation, so they are not set here.
meta = {}
if event_type == "login" {
  meta.login_success = eventid == "cowrie.login.success"
}
if event_type == "command" {
  meta.command_success = eventid == "cowrie.command.input"
}
if event_type == "download" {
  url, url_err = string(raw.url)
  if url_err == null {
    meta.url = url
    parsed, perr = parse_url(url)
    if perr == null {
      meta.dl_host = parsed.host
      segs = split(string!(parsed.path), "/")
      fn = segs[-1]
      if fn != null && fn != "" { meta.dl_filename = fn }
    }
  }
}

. = {
  "timestamp":     raw.timestamp,
  "honeypot":      "cowrie",
  "protocol":      raw.protocol,
  "src_ip":        raw.src_ip,
  "src_port":      raw.src_port,
  "session_id":    raw.session,
  "event_type":    event_type,
  "username":      raw.username,
  "password":      raw.password,
  "payload":       payload,
  "sample_sha256": raw.shasum,
  "meta":          meta,
}
'''

# ── Sinks ─────────────────────────────────────────────────────────────

[sinks.loki_cowrie]
type = "loki"
inputs = ["cowrie_json"]
endpoint = "http://${LOKI_HOST}:3100"
labels.job = "cowrie"
labels.host = "${HOSTNAME}"

[sinks.loki_cowrie.encoding]
codec = "text"

[sinks.loki_cowrie_events]
type = "loki"
inputs = ["cowrie_events"]
endpoint = "http://${LOKI_HOST}:3100"
labels.job = "events"
labels.honeypot = "cowrie"
labels.host = "${HOSTNAME}"

[sinks.loki_cowrie_events.encoding]
codec = "json"

[sinks.loki_auth]
type = "loki"
inputs = ["auth_log"]
endpoint = "http://${LOKI_HOST}:3100"
labels.job = "auth"
labels.host = "${HOSTNAME}"

[sinks.loki_auth.encoding]
codec = "text"

[sinks.loki_syslog]
type = "loki"
inputs = ["syslog_file"]
endpoint = "http://${LOKI_HOST}:3100"
labels.job = "syslog"
labels.host = "${HOSTNAME}"

[sinks.loki_syslog.encoding]
codec = "text"

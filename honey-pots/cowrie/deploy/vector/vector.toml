data_dir = "/vector-data"

# ── Sources ───────────────────────────────────────────────────────────

[sources.malware_analysis]
type = "file"
include = ["/logs/malware/malware-analysis.json"]
read_from = "beginning"

[sources.cowrie_json]
type = "file"
include = ["/logs/cowrie/cowrie.json"]
read_from = "beginning"

[sources.auth_log]
type = "file"
include = ["/hostlogs/auth.log"]
read_from = "beginning"

[sources.syslog_file]
type = "file"
include = ["/hostlogs/syslog"]
read_from = "beginning"

# ── Sinks ─────────────────────────────────────────────────────────────

[sinks.loki_malware]
type = "loki"
inputs = ["malware_analysis"]
endpoint = "http://${LOKI_HOST}:3100"
labels.job = "malware"
labels.host = "${HOSTNAME}"

[sinks.loki_malware.encoding]
codec = "text"

[sinks.loki_cowrie]
type = "loki"
inputs = ["cowrie_json"]
endpoint = "http://${LOKI_HOST}:3100"
labels.job = "cowrie"
labels.host = "${HOSTNAME}"

[sinks.loki_cowrie.encoding]
codec = "text"

[sinks.loki_auth]
type = "loki"
inputs = ["auth_log"]
endpoint = "http://${LOKI_HOST}:3100"
labels.job = "auth"
labels.host = "${HOSTNAME}"

[sinks.loki_auth.encoding]
codec = "text"

[sinks.loki_syslog]
type = "loki"
inputs = ["syslog_file"]
endpoint = "http://${LOKI_HOST}:3100"
labels.job = "syslog"
labels.host = "${HOSTNAME}"

[sinks.loki_syslog.encoding]
codec = "text"

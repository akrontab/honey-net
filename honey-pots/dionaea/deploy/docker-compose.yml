services:
  dionaea:
    build:
      context: ./dionaea
    container_name: dionaea
    restart: unless-stopped
    ports:
      - "21:21"
      - "139:139"
      - "445:445"
    volumes:
      - ./dionaea/services-enabled:/opt/dionaea/etc/dionaea/services-enabled:ro
      - ./dionaea/ihandlers-enabled:/opt/dionaea/etc/dionaea/ihandlers-enabled:ro
      - ./volumes/logs:/opt/dionaea/var/log/dionaea
      - ../inbox/dionaea:/opt/dionaea/var/lib/dionaea/binaries
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - honeypot

  vector:
    image: timberio/vector:0.42.0-alpine
    container_name: vector
    restart: unless-stopped
    user: root
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./volumes/logs:/logs/dionaea:ro
      - /var/log:/hostlogs:ro
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      - vector-data:/vector-data
    environment:
      - LOKI_HOST=${LOKI_HOST}
      - HOSTNAME=${HONEYPOT_HOSTNAME:-dionaea-honeypot}
    networks:
      - honeypot

volumes:
  vector-data:

networks:
  honeypot:
    driver: bridge

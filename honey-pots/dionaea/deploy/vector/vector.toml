data_dir = "/vector-data"

# ── Sources ───────────────────────────────────────────────────────────

[sources.dionaea]
type = "file"
include = ["/logs/dionaea/dionaea.json"]
read_from = "beginning"

[sources.auth_log]
type = "file"
include = ["/hostlogs/auth.log"]
read_from = "beginning"

[sources.syslog_file]
type = "file"
include = ["/hostlogs/syslog"]
read_from = "beginning"

# ── Sinks ─────────────────────────────────────────────────────────────

[sinks.loki_dionaea]
type = "loki"
inputs = ["dionaea"]
endpoint = "http://${LOKI_HOST}:3100"
labels.job = "dionaea"
labels.host = "${HOSTNAME}"

[sinks.loki_dionaea.encoding]
codec = "text"

[sinks.loki_auth]
type = "loki"
inputs = ["auth_log"]
endpoint = "http://${LOKI_HOST}:3100"
labels.job = "auth"
labels.host = "${HOSTNAME}"

[sinks.loki_auth.encoding]
codec = "text"

[sinks.loki_syslog]
type = "loki"
inputs = ["syslog_file"]
endpoint = "http://${LOKI_HOST}:3100"
labels.job = "syslog"
labels.host = "${HOSTNAME}"

[sinks.loki_syslog.encoding]
codec = "text"

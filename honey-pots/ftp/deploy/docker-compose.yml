services:
  ftp:
    build:
      context: ./ftp
    container_name: ftp
    restart: unless-stopped
    ports:
      - "0.0.0.0:21:21"
      - "0.0.0.0:60000-60010:60000-60010"
    volumes:
      - ./volumes/logs:/logs
      - ../inbox/ftp:/samples
    environment:
      - FTP_LOG_FILE=/logs/ftp.json
      - FTP_SAMPLES_DIR=/samples
      - FTP_PASSIVE_HOST=${FTP_PASSIVE_HOST:-}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: '0.2'
    networks:
      - honeypot

  vector:
    image: timberio/vector:0.42.0-alpine
    container_name: vector
    restart: unless-stopped
    user: root
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./volumes/logs:/logs/ftp:ro
      - /var/log:/hostlogs:ro
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      - vector-data:/vector-data
    environment:
      - LOKI_HOST=${LOKI_HOST}
      - HOSTNAME=${HONEYPOT_HOSTNAME:-ftp-honeypot}
    networks:
      - honeypot

volumes:
  vector-data:

networks:
  honeypot:
    driver: bridge

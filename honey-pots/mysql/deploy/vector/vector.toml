data_dir = "/vector-data"

# ── Sources ───────────────────────────────────────────────────────────

[sources.mysql_honeypot]
type = "file"
include = ["/logs/mysql/mysql.json"]
read_from = "beginning"

[sources.auth_log]
type = "file"
include = ["/hostlogs/auth.log"]
read_from = "beginning"

[sources.syslog_file]
type = "file"
include = ["/hostlogs/syslog"]
read_from = "beginning"

# ── Transforms ────────────────────────────────────────────────────────

# Normalised cross-honeypot event stream. Raw mysql events continue to ship
# untouched via [sinks.loki_mysql]; this transform produces a parallel stream
# under {job="events", honeypot="mysql"}.
[transforms.mysql_events]
type = "remap"
inputs = ["mysql_honeypot"]
source = '''
raw = parse_json!(string!(.message))

event_type_map = {
  "connect": "connect",
  "login":   "login",
  "query":   "query",
  "session": "session_end",
}

event_type, _ = get(event_type_map, [string!(raw.event)])
if event_type == null { abort }

# Standard meta vocabulary — see honey-pots/CLAUDE.md.
meta = {}
if event_type == "login" {
  # The MySQL honeypot accepts every login (always-accept decoy).
  meta.login_success = true
  meta.auth_method = "native_password"
}
if raw.database != null && raw.database != "" { meta.database = raw.database }

. = {
  "timestamp":     raw.timestamp,
  "honeypot":      "mysql",
  "protocol":      "mysql",
  "src_ip":        raw.src_ip,
  "src_port":      raw.src_port,
  "session_id":    raw.conn_id,
  "event_type":    event_type,
  "username":      raw.username,
  "password":      null,
  "payload":       raw.query,
  "sample_sha256": null,
  "meta":          meta,
}
'''

# ── Sinks ─────────────────────────────────────────────────────────────

[sinks.loki_mysql]
type = "loki"
inputs = ["mysql_honeypot"]
endpoint = "http://${LOKI_HOST}:3100"
labels.job = "mysql"
labels.host = "${HOSTNAME}"

[sinks.loki_mysql.encoding]
codec = "text"

[sinks.loki_mysql_events]
type = "loki"
inputs = ["mysql_events"]
endpoint = "http://${LOKI_HOST}:3100"
labels.job = "events"
labels.honeypot = "mysql"
labels.host = "${HOSTNAME}"

[sinks.loki_mysql_events.encoding]
codec = "json"

[sinks.loki_auth]
type = "loki"
inputs = ["auth_log"]
endpoint = "http://${LOKI_HOST}:3100"
labels.job = "auth"
labels.host = "${HOSTNAME}"

[sinks.loki_auth.encoding]
codec = "text"

[sinks.loki_syslog]
type = "loki"
inputs = ["syslog_file"]
endpoint = "http://${LOKI_HOST}:3100"
labels.job = "syslog"
labels.host = "${HOSTNAME}"

[sinks.loki_syslog.encoding]
codec = "text"

services:
  mysql-honeypot:
    build:
      context: ./honeypot
    container_name: mysql-honeypot
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - ./volumes/logs:/logs
    environment:
      - HONEYPOT_HOSTNAME=${HONEYPOT_HOSTNAME:-mysql-honeypot}
      - LOG_FILE=/logs/mysql-honeypot.json
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.3'
    networks:
      - honeypot

  vector:
    image: timberio/vector:0.42.0-alpine
    container_name: vector
    restart: unless-stopped
    user: root
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./volumes/logs:/logs/mysql:ro
      - /var/log:/hostlogs:ro
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      - vector-data:/vector-data
    environment:
      - LOKI_HOST=${LOKI_HOST}
      - HOSTNAME=${HONEYPOT_HOSTNAME:-mysql-honeypot}
    networks:
      - honeypot

volumes:
  vector-data:

networks:
  honeypot:
    driver: bridge

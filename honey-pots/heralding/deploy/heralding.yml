# Heralding config for honey-net. Log paths are absolute so heralding can run
# from WORKDIR=/data (ephemeral TLS certs) while writing logs to /logs (the volume).
# Derived from heralding==1.0.7 default config; keep in sync when bumping the pin.

public_ip_as_destination_ip: false

bind_host: 0.0.0.0

activity_logging:
  file:
    enabled: true
    session_csv_log_file: "/logs/log_session.csv"
    session_json_log_file: "/logs/log_session.json"
    authentication_log_file: "/logs/log_auth.csv"

  syslog:
    enabled: false

  hpfeeds:
    enabled: false
    session_channel: "heralding.session"
    auth_channel: "heralding.auth"
    host:
    port: 20000
    ident:
    secret:

  curiosum:
    enabled: false
    port: 23400

hash_cracker:
  enabled: false

capabilities:
  ftp:
    enabled: true
    port: 21
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: "Microsoft FTP Server"
      syst_type: "Windows-NT"

  telnet:
    enabled: true
    port: 23
    timeout: 30
    protocol_specific_data:
      max_attempts: 3

  ssh:
    enabled: true
    port: 22
    timeout: 30
    protocol_specific_data:
      banner: "SSH-2.0-OpenSSH_6.6.1p1 Ubuntu-2ubuntu2.8"

  smtp:
    enabled: true
    port: 25
    timeout: 30
    protocol_specific_data:
      banner: "Microsoft ESMTP MAIL service ready"
      fqdn: ""

  http:
    enabled: true
    port: 80
    timeout: 30
    protocol_specific_data:
      banner: ""

  pop3:
    enabled: true
    port: 110
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: "+OK POP3 server ready"

  imap:
    enabled: true
    port: 143
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: "* OK IMAP4rev1 Server Ready"

  https:
    enabled: true
    port: 443
    timeout: 30
    protocol_specific_data:
      banner: ""
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        valid_days: 365
        serial_number: 0

  socks5:
    enabled: true
    port: 1080
    timeout: 30

  mysql:
    enabled: true
    port: 3306
    timeout: 30

  rdp:
    enabled: false
    port: 3389
    timeout: 30
    protocol_specific_data:
      banner: ""
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        valid_days: 365
        serial_number: 0

  postgresql:
    enabled: true
    port: 5432
    timeout: 30

  vnc:
    enabled: true
    port: 5900
    timeout: 30

  pop3s:
    enabled: false
    port: 995
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: "+OK POP3 server ready"
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        valid_days: 365
        serial_number: 0

  imaps:
    enabled: false
    port: 993
    timeout: 30
    protocol_specific_data:
      max_attempts: 3
      banner: "* OK IMAP4rev1 Server Ready"
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        valid_days: 365
        serial_number: 0

  smtps:
    enabled: false
    port: 465
    timeout: 30
    protocol_specific_data:
      banner: "Microsoft ESMTP MAIL service ready"
      fqdn: ""
      cert:
        common_name: "*"
        country: "US"
        state: None
        locality: None
        organization: None
        organizational_unit: None
        valid_days: 365
        serial_number: 0

# Dropped into /etc/ssh/sshd_config.d/ by setup.sh.
# Hardens the real sshd on port 65022. Has no effect on honeypot services.
#
# PREREQUISITE: Confirm key-based login to port 65022 works before setup.sh
# applies this file. PasswordAuthentication no will lock out password logins.

PermitRootLogin prohibit-password
PasswordAuthentication no
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
AllowUsers root

MaxAuthTries 3
LoginGraceTime 20s

# Keep idle sessions alive but disconnect if the client disappears
ClientAliveInterval 300
ClientAliveCountMax 2

# No tunneling — this host runs one thing
AllowTcpForwarding no
X11Forwarding no
PermitEmptyPasswords no

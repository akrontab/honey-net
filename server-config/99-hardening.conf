# Kernel hardening for honey-net hosts.
# Installed to /etc/sysctl.d/99-hardening.conf by setup.sh.

# ── Network ─────────────────────────────────────────────────────────

# SYN cookies — absorb SYN floods from automated scanners hitting the honeypot
net.ipv4.tcp_syncookies = 1

# Don't forward packets (this host is not a router)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Ignore ICMP redirects (prevents routing table manipulation)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0

# Reject source-routed packets
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Log packets with impossible source addresses
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore broadcast pings
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Allow unprivileged processes to bind ports < 1024.
# Required for rootless Docker to publish honeypot ports (22, 23, 21, 139, 445).
net.ipv4.ip_unprivileged_port_start = 0

# ── Kernel ──────────────────────────────────────────────────────────

# Restrict ptrace — mitigates some container-escape techniques
kernel.yama.ptrace_scope = 2

# Hide kernel symbol addresses from unprivileged users
kernel.kptr_restrict = 2

# Restrict dmesg to root
kernel.dmesg_restrict = 1

# Disable core dumps from setuid programs
fs.suid_dumpable = 0

# Restrict perf events to root (limits side-channel attack surface)
kernel.perf_event_paranoid = 3

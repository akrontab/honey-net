data_dir = "/vector-data"

# ── Sources ───────────────────────────────────────────────────────────

[sources.detections]
type = "file"
include = ["/logs/detections.json"]
read_from = "beginning"
fingerprinting.strategy = "device_and_inode"

# ── Transforms ────────────────────────────────────────────────────────

[transforms.detections_parse]
type = "remap"
inputs = ["detections"]
source = '''
parsed, err = parse_json(string!(.message))
if err != null { abort }
. = merge(., parsed)
'''

# ── Sinks ─────────────────────────────────────────────────────────────

[sinks.loki_detections]
type = "loki"
inputs = ["detections_parse"]
endpoint = "http://${LOKI_HOST}:3100"
labels.job = "detections"
labels.severity = "{{ severity }}"
labels.rule_id = "{{ rule_id }}"
labels.category = "{{ category }}"

[sinks.loki_detections.encoding]
codec = "json"
